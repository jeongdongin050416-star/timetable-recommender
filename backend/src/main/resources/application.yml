spring:
  # Spring Boot는 application.properties, application.yml, application.yaml을 설정
  # 파일로 인식한다. 일반적으로 클래스패스 루트(src/main/resources)와 그 아래 config,
  # 실행 디렉터리와 그 아래 config 등 정해진 위치에서 설정을 찾는다.
  application:
    # 애플리케이션을 식별하는 이름이다.
    name: timetable-recommender
  # Spring Boot가 접속할 데이터베이스 정보를 설정한다.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/timetable}
    username: ${DB_USERNAME:timetable}
    password: ${DB_PASSWORD:timetable}
    # ${환경_변수:기본값} 문법이다. 환경 변수가 없으면 콜론 뒤의 값을 사용한다.
    # 기본 접속 정보는 localhost:5432의 timetable DB, 사용자와 비밀번호는 timetable이다.
    # 여러 DataSource를 쓰려면 별도 설정 클래스와 이름을 명시해 구성해야 한다.
  jpa:
    hibernate:
      # Hibernate가 테이블을 만들거나 변경하지 않고 엔티티 매핑과 실제 스키마가
      # 일치하는지만 검사한다. 불일치하면 애플리케이션 시작에 실패한다.
      ddl-auto: validate
    # HTTP 요청 전체가 끝날 때까지 영속성 컨텍스트를 열어 두지 않는다.
    open-in-view: false
  # 시작 시 db/migration의 아직 적용되지 않은 SQL을 순서대로 실행한다.
  flyway:
    enabled: true

server:
  # 백엔드가 HTTP 요청을 받을 포트이며 기본 주소는 http://localhost:8080이다.
  port: 8080

app:
  csv-import:
    enabled: false
    course-resource: classpath:data/course.csv
    course-section-resource: classpath:data/course_section.csv
    section-time-resource: classpath:data/section_time.csv
    course-prerequisite-resource: classpath:data/course_prerequisite.csv
    course-interest-area-resource: classpath:data/course_interest_area.csv

# ORM(Object-Relational Mapping)은 객체와 관계형 DB 테이블 사이를 연결하는 기술이다.
# JPA는 Java ORM의 표준 규칙이고 Hibernate는 그 규칙을 구현한 프레임워크다.
# 이 프로젝트에서는 Flyway가 DDL(스키마 변경)을 관리하고 Hibernate는 객체-데이터 변환과
# 스키마 검증을 담당한다. 엔티티는 backend/src/main/java/.../domain에 있다.
#
# DB와 엔티티 연결 과정
# 1. Spring Boot가 @Entity 클래스를 찾아 테이블·열 매핑 정보를 만든다.
# 2. DataSource 설정으로 PostgreSQL에 접속한다.
# 3. Flyway가 미적용 마이그레이션을 실행한다.
# 4. Hibernate가 ddl-auto: validate에 따라 매핑과 실제 스키마를 비교한다.
# 5. 검증이 끝나면 EntityManagerFactory를 준비하고 Repository 또는 EntityManager로 DB를 사용한다.
#
# EntityManagerFactory는 생성 비용이 큰 EntityManager 생성 공장으로, 보통 애플리케이션에서
# 하나를 공유한다. EntityManager는 영속성 컨텍스트를 관리하며 다음 일을 한다.
# - persist(), find(), remove() 같은 명령을 INSERT, SELECT, DELETE 등의 SQL로 연결한다.
# - 1차 캐시를 사용하고, 변경 감지(dirty checking)로 필요한 UPDATE를 반영한다.
# - 객체 중심 Java 모델과 테이블 중심 관계형 모델의 차이를 완화한다.
